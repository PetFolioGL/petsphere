name: "CodeQL Advanced"

# Scans GitHub Actions workflow files (actions) and native iOS Swift code (swift).
# Note: Dart/Flutter source is not yet supported by CodeQL. The java-kotlin matrix
# entry has been removed because Flutter's Android Kotlin is auto-generated
# boilerplate that CodeQL autobuild cannot compile without a full Flutter setup.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run every Monday at 08:16 UTC to catch newly disclosed vulnerabilities
    - cron: '16 8 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Scan GitHub Actions workflow YAML files for supply-chain vulnerabilities
          - language: actions
            build-mode: none
          # Scan native iOS Swift code; requires a full Flutter build so CodeQL
          # can trace the Swift compilation (manual build mode)
          - language: swift
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Flutter must be available before CodeQL init so that `flutter pub get`
      # can resolve dependencies; the actual iOS compile happens after init so
      # CodeQL's build tracer can observe the Swift compilation.
      - name: Setup Flutter
        if: matrix.language == 'swift'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        if: matrix.language == 'swift'
        run: flutter pub get

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds high-confidence vulnerability queries on top
          # of the default security suite (recommended for production apps)
          queries: security-extended

      # Build iOS so CodeQL's tracer can capture Swift compilation artifacts.
      # --no-codesign avoids certificate requirements on CI runners.
      - name: Build iOS for CodeQL tracing
        if: matrix.language == 'swift'
        run: flutter build ios --no-codesign --simulator

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
